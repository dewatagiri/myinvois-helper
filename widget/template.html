<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#1b1f24; --mute:#5f6b7a; --line:#e3e7ec; --ok:#1a7f4b; --bad:#c0392b; --warn:#b26a00; --accent:#0b5cad; }
  * { box-sizing:border-box }
  body { margin:0; background:#fff; color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #root { padding:16px; max-width:820px }
  .title { font-size:17px; font-weight:650; margin-bottom:4px }
  .big { font-size:15px; margin:8px 0 12px }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:12px 0 4px }
  .kv { color:var(--mute); font-size:12.5px } .kv b { color:var(--ink); font-weight:600 }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; margin-left:6px; vertical-align:middle; font-weight:600 }
  .badge.ok { background:#e5f5ec; color:var(--ok) } .badge.bad { background:#fdecea; color:var(--bad) } .badge.warn { background:#fff4e0; color:var(--warn) }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit }
  .parties { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0 }
  .party { border:1px solid var(--line); border-radius:10px; padding:10px 12px }
  .nm { font-weight:600 }
  table { width:100%; border-collapse:collapse; margin-top:6px }
  th,td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top }
  th { font-size:11.5px; color:var(--mute); font-weight:600 }
  .n { text-align:right; white-space:nowrap }
  .sub { font-size:11.5px; color:var(--mute) }
  tfoot td { border:none; padding:3px 6px } tfoot td:first-child { text-align:right; color:var(--mute) }
  .grand td { font-weight:700; font-size:15px; border-top:2px solid var(--ink); padding-top:6px }
  .grand td:first-child { color:var(--ink) }
  ul,ol { margin:4px 0; padding-left:20px } .check ul { list-style:none; padding:0 }
  .check li { padding:4px 0; border-bottom:1px dashed var(--line) }
  .check li span { display:inline-block; min-width:52px; font-size:11px; font-weight:700; text-transform:uppercase }
  li.error span { color:var(--bad) } li.warn span { color:var(--warn) } li.info span { color:var(--accent) }
  .foot { margin-top:14px; font-size:12px; color:var(--mute) }
  @media (max-width:560px) { .parties { grid-template-columns:1fr } }
  @media print { button { display:none } }
</style></head>
<body><div id="root"><div class="kv">Loading…</div></div>
<script>/*__BUNDLE__*/</script>
</body></html>
